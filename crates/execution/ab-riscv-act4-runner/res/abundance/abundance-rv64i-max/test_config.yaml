# ACT4 framework top-level config for the abundance RV64I-max core.
#
# compiler_exe: riscv64-unknown-elf-gcc on $PATH, targeting lp64 ABI (no F/D).
#   The march string must match the extensions in abundance-rv64i-max.yaml.
#
# ref_model_exe: sail_riscv_sim on $PATH.
#   Run `sail_riscv_sim --help` to verify the binary name on your system;
#   some distros install it as `riscv_sim_RV64`.
#
# include_priv_tests: true because this core implements a real M-mode trap handler
#   (mtvec is writable, ecall/illegal-instruction dispatch through it; see
#   STANDARD_SM_SUPPORTED in rvmodel_macros.h) and needs the priv/ suites gated on the
#   "Sm" required-extension (the Sm groups of Sm, Ssstrict, Exceptions and Zawrs, InterruptsSm,
#   ...) - `select_tests` only exempts extensions from this flag when they don't require Sm/S/U
#   at all (e.g. Zkr), which isn't the case here.
#   This core has no S/U mode, no PMP, and no interrupts, so the rest of
#   the priv/ suite (anything requiring S or U) is still excluded automatically: `abundance-
#   rv64i-max.yaml` doesn't declare S/U/Sscofpmf/Sstc/etc, so `select_tests`'s implemented-
#   extensions subset check filters those tests out regardless of this flag.
#
# Ssstrict (see abundance-rv64i-max.yaml) enables the Sm group of Ssstrict - the deterministic-
# reserved-encoding test suite discussed in https://github.com/riscv/riscv-arch-test/discussions/1251
# and https://github.com/riscv/riscv-arch-test/issues/1633. Its S/U/H groups are excluded the same
# way as the rest of the S/U-only suite, since this core has no S/U mode.
#
# MEI_INTR_IMPL, MSI_INTR_IMPL and MTI_INTR_IMPL are all false (see the UDB config), so
# InterruptsSm and Zawrs skip the bins that need an interrupt to become pending, which leaves
# InterruptsSm with no bins at all.
# TODO: revisit once/if the interpreter grows a CLINT-style mtimecmp/msip device - that would let
#   InterruptsSm and Zawrs' interrupt bins run too.

name: abundance-rv64i-max
compiler_exe: riscv64-unknown-elf-gcc
objdump_exe: riscv64-unknown-elf-objdump
ref_model_exe: sail_riscv_sim
udb_config: abundance-rv64i-max.yaml
linker_script: link.ld
dut_include_dir: .
include_priv_tests: true
